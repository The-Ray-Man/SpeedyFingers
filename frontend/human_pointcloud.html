<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pose Classification and Repetition Counting</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <style>
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline></video>
  <canvas id="output"></canvas>

  <script>
    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('output');
    const canvasCtx = canvasElement.getContext('2d');

    // Load MediaPipe Pose
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`,
    });
    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5,
    });

    // Start video stream
    async function startVideo() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      videoElement.srcObject = stream;
      videoElement.onloadedmetadata = () => {
        videoElement.play();
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
      };
    }

    // Helper function to calculate angles
    function calculateAngle(a, b, c) {
      const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      return Math.abs(radians * (180 / Math.PI));
    }

    // Pose classification logic
    let repetitions = 0;
    let isDown = false;

    function classifyPose(landmarks) {
      // Example: Push-up classification
      const leftElbowAngle = calculateAngle(
        landmarks[11], // Left shoulder
        landmarks[13], // Left elbow
        landmarks[15]  // Left wrist
      );

      const rightElbowAngle = calculateAngle(
        landmarks[12], // Right shoulder
        landmarks[14], // Right elbow
        landmarks[16]  // Right wrist
      );

      // Check if the pose matches "down" position
      if (leftElbowAngle < 90 && rightElbowAngle < 90) {
        if (!isDown) {
          isDown = true;
        }
      } else if (isDown) {
        // Count repetition when transitioning from "down" to "up"
        repetitions++;
        isDown = false;
        console.log(`Repetitions: ${repetitions}`);
      }
    }

    // Process pose landmarks
    pose.onResults((results) => {
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        classifyPose(results.poseLandmarks);

        // Draw landmarks
        for (const landmark of results.poseLandmarks) {
          canvasCtx.beginPath();
          canvasCtx.arc(landmark.x * canvasElement.width, landmark.y * canvasElement.height, 5, 0, 2 * Math.PI);
          canvasCtx.fillStyle = 'red';
          canvasCtx.fill();
        }
      }
    });

    // Start the application
    startVideo();
    pose.send({ image: videoElement });
  </script>
</body>
</html>
