server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json application/wasm;

    # Handle all routes - serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Self-hosted MediaPipe WASM and models. Their URLs aren't content-hashed,
    # so revalidate instead of caching them as immutable; a missing file must
    # 404 rather than fall back to index.html.
    location ^~ /mediapipe/ {
        expires epoch;
        try_files $uri =404;
    }

    # Cache static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
